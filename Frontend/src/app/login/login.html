<main class="login-page">

  <section class="login-hero">
    <div class="hero-content">

      <div class="brand-badge">
        SYSTEM METRICS
      </div>

      <h1>
        Sunucularını tek noktadan takip et.
      </h1>

      <p>
        CPU, RAM, Disk ve Network metriklerini gerçek zamanlı izle,
        sistem durumunu kontrol altında tut.
      </p>

      <div class="metric-preview">

        <div class="preview-item">
          <span class="preview-label">CPU</span>

          <div class="preview-line">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="preview-item">
          <span class="preview-label">RAM</span>

          <div class="preview-bar">
            <div></div>
          </div>
        </div>

        <div class="preview-status">
          <span class="status-dot"></span>
          Monitoring aktif
        </div>

      </div>

    </div>
  </section>


  <section class="login-area">

    <div class="login-card">

      <div class="login-header">
        <h2>Giriş Yap</h2>

        <p>
          Monitoring paneline devam etmek için hesabına giriş yap.
        </p>
      </div>


      <form (ngSubmit)="login()">

        <div class="form-group">

          <label for="username">
            Kullanıcı Adı
          </label>

          <input
            id="username"
            type="text"
            placeholder="Kullanıcı adınızı girin"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
          >

        </div>


        <div class="form-group">

          <label for="password">
            Şifre
          </label>

          <input
            id="password"
            type="password"
            placeholder="Şifrenizi girin"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
          >

        </div>

        <button type="submit" class="login-button">Giriş Yap</button>

      </form>

    </div>

  </section>

</main>
