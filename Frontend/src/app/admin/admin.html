<h1>Admin Paneli</h1>

<form (ngSubmit)="addUser()">

    <label for="username"> Kullanıcı Adı: </label>
    <input id="username" type="text" [(ngModel)]="username" name="username" required>

    <label for="name"> Ad: </label>
    <input id="name" type="text" [(ngModel)]="name" name="name" required>

    <label for="surname"> Soyad: </label>
    <input id="surname" type="text" [(ngModel)]="surname" name="surname" required>

    <label for="email"> Email: </label>
    <input id="email" type="email" [(ngModel)]="email" name="email" required>

    <label for="password"> Şifre: </label>
    <input id="password" type="password" [(ngModel)]="password" name="password" required>

    <button type="submit"> Ekle </button>

</form>

<form (ngSubmit)="addAlarm()">

    <select name="recipientUserId" [(ngModel)]="recipientUserId" required>
        
        <option [ngValue]="null" disabled>Kullanıcı Seçiniz</option>

        @for (user of users; track user.id) {
            <option [ngValue]="user.id">{{ user.username }} - {{ user.name }} {{ user.surname }}</option>
        }

    </select>

    <select name="metricType" [(ngModel)]="metricType" required>

        <option value="" disabled>Metrik türü seçiniz</option>
        <option value="cpu">CPU</option>
        <option value="ram">RAM</option>
        <option value="disk">Disk</option>
        <option value="network">Network</option>

    </select>

    <input 
        type="number" name="threshold" [(ngModel)]="threshold" 
        placeholder="Eşik değeri" min="0" step="0.01" required
    >

    <select name="severity" [(ngModel)]="severity" required>

        <option value="" disabled>Alarm seviyesi seçiniz</option>
        <option value="low">Düşük</option>
        <option value="medium">Orta</option>
        <option value="high">Yüksek</option>
        <option value="critical">Kritik</option>

    </select>

    <button type="submit">Alarm Ekle</button>

</form>
